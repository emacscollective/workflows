name: 'Statistics'
permissions: {}
on:
  workflow_call:
    secrets:
      rclone_config:
        required: true
env:
  pwd: ${{ github.event.repository.name }}
jobs:
  statistics:
    name: 'Generate statistics'
    runs-on: ubuntu-24.04
    steps:
      - name: 'Install dependencies'
        run: |
          sudo apt update
          sudo apt install -y gnuplot python-is-python3 rclone emacs
      - name: 'Install gitstats'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: tarsius/gitstats
          path: _gitstats
          persist-credentials: false
      - name: 'Checkout ${{ github.repository }}'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: ${{ env.pwd }}
          fetch-depth: 0
          persist-credentials: false
      - name: 'Configure timezone'
        run: |
          sudo timedatectl set-timezone Europe/Zurich
      - name: 'Generate statistics'
        working-directory: ${{ env.pwd }}
        env:
          # Must be relative to our docs/ directory.
          GITSTATS: ../../_gitstats/gitstats
        run: |
          make stats
      - name: 'Configure rclone'
        env:
          CONFIG: ${{ secrets.rclone_config }}
        run: |
          printf "${CONFIG}" | base64 --decode > "${RUNNER_TEMP}/rclone.conf"
      - name: 'Publish statistics'
        working-directory: ${{ env.pwd }}
        env:
          RCLONE_ARGS: -v --config "${RUNNER_TEMP}/rclone.conf"
        run: |
          make stats-upload
